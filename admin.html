<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSIRIS - Panneau Administrateur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { cyber: { 900: '#0f172a', 800: '#1e293b', blue: '#38bdf8' } } }
            }
        }
    </script>
</head>
<body class="bg-cyber-900 text-slate-300 p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-8 flex items-center gap-3">
            <span>⚙️</span> Panneau Administrateur OSIRIS
        </h1>

        <div class="bg-cyber-800 p-6 rounded-xl border border-slate-700 mb-8">
            <h2 class="text-xl font-bold text-white mb-4">Clé Administrateur</h2>
            <input id="adminKey" type="password" value="super_secret_admin_osiris_2026" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-cyber-blue outline-none">
        </div>

        <div class="bg-cyber-800 p-6 rounded-xl border border-slate-700 shadow-[0_0_15px_rgba(56,189,248,0.1)]">
            <h2 class="text-xl font-bold text-white mb-4">Injecter une nouvelle Menace (IP)</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Adresse IP</label>
                    <input id="ip" type="text" placeholder="ex: 192.168.1.50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-cyber-blue outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Signature de la menace</label>
                    <input id="threat" type="text" placeholder="ex: Botnet Mirai détecté" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-cyber-blue outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Score de confiance (0.0 à 1.0)</label>
                    <input id="confidence" type="number" step="0.01" value="0.99" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-cyber-blue outline-none">
                </div>
                <button onclick="injectThreat()" class="w-full bg-cyber-blue hover:bg-blue-400 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4">
                    📡 Diffuser la menace au réseau
                </button>
            </div>
            
            <div id="status" class="mt-4 text-sm font-medium hidden"></div>
        </div>
    </div>

    <script>
        async function injectThreat() {
            const adminKey = document.getElementById('adminKey').value;
            const ip = document.getElementById('ip').value;
            const threat = document.getElementById('threat').value;
            const confidence = document.getElementById('confidence').value;
            const statusDiv = document.getElementById('status');

            statusDiv.className = "mt-4 text-sm font-medium text-blue-400";
            statusDiv.innerText = "Injection en cours...";
            statusDiv.classList.remove('hidden');

            try {
                const res = await fetch(`https://osint-monetization-suite.onrender.com/api/v1/admin/threats?ip=${ip}&threat_description=${encodeURIComponent(threat)}&confidence=${confidence}`, {
                    method: 'POST',
                    headers: { 'x-admin-key': adminKey }
                });

                const data = await res.json();
                
                if (res.ok) {
                    statusDiv.className = "mt-4 text-sm font-medium text-green-400";
                    statusDiv.innerText = "✅ Succès : " + data.message;
                    document.getElementById('ip').value = '';
                } else {
                    statusDiv.className = "mt-4 text-sm font-medium text-red-400";
                    statusDiv.innerText = "❌ Erreur : " + data.detail;
                }
            } catch (err) {
                statusDiv.className = "mt-4 text-sm font-medium text-red-400";
                statusDiv.innerText = "❌ Erreur de connexion.";
            }
        }
    </script>
</body>
</html>
