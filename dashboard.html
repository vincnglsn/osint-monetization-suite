<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSIRIS AI - Blueprint Dashboard</title>

    <!-- Blueprint CSS -->
    <link href="https://unpkg.com/normalize.css@^8.0.1" rel="stylesheet" />
    <link href="https://unpkg.com/@blueprintjs/icons@5.0.0/lib/css/blueprint-icons.css" rel="stylesheet" />
    <link href="https://unpkg.com/@blueprintjs/core@5.0.0/lib/css/blueprint.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #293742; /* Blueprint Dark Theme bg */
            color: #f5f8fa;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #394B59;
            padding-bottom: 15px;
        }
    </style>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bp5-dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Dashboard() {
            const [threats, setThreats] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [apiKey, setApiKey] = useState("premium_subscriber_key_49usd");

            const fetchThreats = async () => {
                setLoading(true);
                setError(null);
                try {
                    // Fetch IP threats
                    let ips = [];
                    try {
                        const ipRes = await fetch("https://osint-monetization-suite.onrender.com/api/v1/threats/ips", { headers: { "x-api-key": apiKey } });
                        if (ipRes.ok) {
                            const ipData = await ipRes.json();
                            ips = (ipData.data || []).map(t => ({ ...t, target: t.ip, type: 'IP' }));
                        } else if (ipRes.status === 403) {
                            throw new Error("Abonnement inactif ou clé API invalide.");
                        }
                    } catch (e) {
                        console.warn("IP fetch error:", e);
                        if (e.message.includes("Abonnement inactif")) throw e;
                    }

                    // Fetch Domain threats (might be 404 if Render hasn't deployed yet)
                    let domains = [];
                    try {
                        const domainRes = await fetch("https://osint-monetization-suite.onrender.com/api/v1/threats/domains", { headers: { "x-api-key": apiKey } });
                        if (domainRes.ok) {
                            const domainData = await domainRes.json();
                            domains = (domainData.data || []).map(t => ({ ...t, target: t.domain, type: 'Domaine' }));
                        }
                    } catch (e) {
                        console.warn("Domain fetch error (probably not deployed yet):", e);
                    }
                    
                    const combined = [...ips, ...domains].sort((a, b) => b.confidence - a.confidence);

                    setThreats(combined);
                    renderCharts(combined);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const renderCharts = (data) => {
                const threatTypes = {};
                data.forEach(t => {
                    const type = t.threat || t.threat_description || 'Inconnu';
                    threatTypes[type] = (threatTypes[type] || 0) + 1;
                });

                if(window.myPieChart) window.myPieChart.destroy();
                const ctx = document.getElementById('threatChart');
                if(ctx) {
                    window.myPieChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(threatTypes),
                            datasets: [{
                                data: Object.values(threatTypes),
                                backgroundColor: ['#E73C3E', '#F29D49', '#2B95D6', '#29A634'],
                                borderColor: '#30404D',
                                borderWidth: 2
                            }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            legend: { display: false }, // Pour Chart.js v2
                            plugins: { 
                                legend: { 
                                    display: false // Pour Chart.js v3+
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            return ' ' + context.label + ' : ' + context.raw;
                                        }
                                    }
                                }
                            } 
                        }
                    });
                }
            };

            useEffect(() => {
                fetchThreats();
            }, []);

            return (
                <div className="dashboard-container">
                    <div className="header">
                        <div>
                            <h1 className="bp5-heading" style={{display: 'flex', alignItems: 'center'}}>
                                <span style={{ marginRight: '10px', fontSize: '24px' }}>🛡️</span> 
                                OSIRIS AI Live Feed
                            </h1>
                            <p className="bp5-text-muted">Tableau de bord de surveillance OSINT (Visualisations Avancées)</p>
                        </div>
                        <div style={{ display: 'flex', gap: '10px' }}>
                            <button className="bp5-button bp5-intent-primary" onClick={fetchThreats} disabled={loading}>
                                🔄 {loading ? 'Chargement...' : 'Actualiser le flux'}
                            </button>
                            <button className="bp5-button bp5-intent-success" onClick={() => window.open('https://osint-monetization-suite.onrender.com/api/v1/threats/export?min_confidence=0.0', '_blank')}>
                                📥 Export Pare-Feu (CSV)
                            </button>
                        </div>
                    </div>

                    <div style={{ marginBottom: '20px' }}>
                        <div className="bp5-card bp5-elevation-1" style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <strong>🔑 Clé API :</strong>
                            <input 
                                className="bp5-input" 
                                type="text" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)} 
                                style={{ width: '300px' }}
                            />
                        </div>
                    </div>

                    {error && (
                        <div className="bp5-callout bp5-intent-danger" style={{ marginBottom: '20px' }}>
                            ⚠️ {error}
                        </div>
                    )}

                    <div style={{ display: 'flex', gap: '20px', marginBottom: '20px', height: '250px' }}>
                        <div className="bp5-card bp5-elevation-2" style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                            <h4 className="bp5-heading">📊 Répartition des menaces actives</h4>
                            <div style={{ height: '180px', position: 'relative', width: '100%' }}>
                                <canvas id="threatChart"></canvas>
                            </div>
                        </div>
                        <div className="bp5-card bp5-elevation-2" style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
                            <h4 className="bp5-heading">🌐 Statut du Réseau OSIRIS</h4>
                            <div style={{ fontSize: '48px', color: '#E73C3E', fontWeight: 'bold' }}>{threats.length}</div>
                            <p className="bp5-text-muted">IP & Domaines bloqués en temps réel</p>
                            <span className="bp5-tag bp5-intent-success bp5-large" style={{ marginTop: '10px'}}>✅ Système BGP & DNS Sécurisés</span>
                        </div>
                    </div>

                    <div className="bp5-card bp5-elevation-2">
                        <h3 className="bp5-heading" style={{ marginBottom: '15px' }}>🎯 Menaces Identifiées (IP & Phishing)</h3>
                        
                        {loading && threats.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '40px' }}><div className="bp5-spinner"><div className="bp5-spinner-animation"></div></div></div>
                        ) : (
                            <table className="bp5-html-table bp5-html-table-striped bp5-html-table-condensed bp5-interactive" style={{ width: '100%' }}>
                                <thead>
                                    <tr>
                                        <th>Cible (IP / Domaine)</th>
                                        <th>Type</th>
                                        <th>Signature de la Menace</th>
                                        <th>Indice de Confiance</th>
                                        <th>Statut</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {threats.map((threat, idx) => (
                                        <tr key={idx}>
                                            <td><strong style={{ fontFamily: 'monospace', color: threat.type === 'IP' ? '#48AFF0' : '#F29D49' }}>{threat.target}</strong></td>
                                            <td><span className={`bp5-tag ${threat.type === 'IP' ? 'bp5-intent-primary' : 'bp5-intent-warning'}`}>{threat.type}</span></td>
                                            <td>{threat.threat || threat.threat_description}</td>
                                            <td>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                                    <div className="bp5-progress-bar bp5-intent-danger bp5-no-stripes" style={{ width: '100px', height: '8px', borderRadius: '4px' }}>
                                                        <div className="bp5-progress-meter" style={{ width: `${threat.confidence * 100}%` }}></div>
                                                    </div>
                                                    <span style={{ fontSize: '12px' }}>{Math.round(threat.confidence * 100)}%</span>
                                                </div>
                                            </td>
                                            <td>
                                                <span className="bp5-tag bp5-intent-danger">🛑 BLOQUÉ</span>
                                            </td>
                                            <td>
                                                <button className="bp5-button bp5-minimal bp5-small" title="Mettre sur liste blanche (Simulation)">🔓</button>
                                                <button className="bp5-button bp5-minimal bp5-small" title="Voir les logs (Simulation)">📄</button>
                                            </td>
                                        </tr>
                                    ))}
                                    {threats.length === 0 && !loading && !error && (
                                        <tr>
                                            <td colSpan="6" style={{ textAlign: 'center', padding: '20px' }}>
                                                Aucune menace détectée.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
