<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSIRIS AI - Blueprint Dashboard</title>

    <!-- Blueprint CSS -->
    <link href="https://unpkg.com/normalize.css@^8.0.1" rel="stylesheet" />
    <link href="https://unpkg.com/@blueprintjs/icons@^5.0.0/lib/css/blueprint-icons.css" rel="stylesheet" />
    <link href="https://unpkg.com/@blueprintjs/core@^5.0.0/lib/css/blueprint.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #293742; /* Blueprint Dark Theme bg */
            color: #f5f8fa;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #394B59;
            padding-bottom: 15px;
        }
    </style>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Blueprint JS -->
    <script src="https://unpkg.com/@blueprintjs/core@^5.0.0/lib/umd/blueprint.js"></script>
    <script src="https://unpkg.com/@blueprintjs/icons@^5.0.0/lib/umd/blueprint-icons.js"></script>

    <!-- Babel for in-browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bp5-dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Card, Elevation, HTMLTable, Tag, Intent, Button, Icon, Tooltip, Spinner, Callout } = Blueprint.Core;

        function Dashboard() {
            const [threats, setThreats] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [apiKey, setApiKey] = useState("premium_subscriber_key_49usd"); // Clé par défaut (démo locale)

            const fetchThreats = async () => {
                setLoading(true);
                setError(null);
                try {
                    // L'URL tapera sur l'API de prod
                    const response = await fetch("https://osint-monetization-suite.onrender.com/api/v1/threats/ips", {
                        headers: {
                            "x-api-key": apiKey
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Erreur API: ${response.status} - Clé invalide ou serveur injoignable.`);
                    }
                    
                    const data = await response.json();
                    setThreats(data.data || []);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            // Charger les données au montage
            useEffect(() => {
                fetchThreats();
            }, []);

            return (
                <div className="dashboard-container">
                    <div className="header">
                        <div>
                            <h1 className="bp5-heading" style={{display: 'flex', alignItems: 'center'}}><Icon icon="shield" size={24} style={{ marginRight: '10px', color: '#48AFF0' }} /> OSIRIS AI Live Feed</h1>
                            <p className="bp5-text-muted">Tableau de bord de surveillance OSINT (Palantir Blueprint)</p>
                        </div>
                        <div>
                            <Button intent={Intent.PRIMARY} icon="refresh" onClick={fetchThreats} loading={loading}>
                                Actualiser le flux
                            </Button>
                        </div>
                    </div>

                    <div style={{ marginBottom: '20px' }}>
                        <Card elevation={Elevation.ONE} style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <strong>Clé API :</strong>
                            <input 
                                className="bp5-input" 
                                type="text" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)} 
                                style={{ width: '300px' }}
                            />
                            <span className="bp5-text-small bp5-text-muted">Testez avec votre clé admin, ou insérez une clé Stripe générée lors d'un achat.</span>
                        </Card>
                    </div>

                    {error && (
                        <Callout intent={Intent.DANGER} icon="error" title="Échec de la récupération des données" style={{ marginBottom: '20px' }}>
                            {error} <br/>
                            <em>Avez-vous bien fait le "Manual Deploy" sur Render pour publier la modification CORS ?</em>
                        </Callout>
                    )}

                    <Card elevation={Elevation.TWO}>
                        <h3 className="bp5-heading" style={{ marginBottom: '15px' }}>Menaces Identifiées (Réseau BGP & Scanners)</h3>
                        
                        {loading && threats.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '40px' }}><Spinner /></div>
                        ) : (
                            <HTMLTable interactive={true} condensed={true} striped={true} style={{ width: '100%' }}>
                                <thead>
                                    <tr>
                                        <th>Adresse IP Source</th>
                                        <th>Signature de la Menace</th>
                                        <th>Indice de Confiance</th>
                                        <th>Statut</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {threats.map((threat, idx) => (
                                        <tr key={idx}>
                                            <td><strong style={{ fontFamily: 'monospace' }}>{threat.ip}</strong></td>
                                            <td>{threat.threat}</td>
                                            <td>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                                    <div className="bp5-progress-bar bp5-intent-danger bp5-no-stripes" style={{ width: '100px', height: '8px', borderRadius: '4px' }}>
                                                        <div className="bp5-progress-meter" style={{ width: `${threat.confidence * 100}%` }}></div>
                                                    </div>
                                                    <span style={{ fontSize: '12px' }}>{Math.round(threat.confidence * 100)}%</span>
                                                </div>
                                            </td>
                                            <td>
                                                <Tag intent={Intent.DANGER} icon="warning-sign">BLOQUÉ</Tag>
                                            </td>
                                            <td>
                                                <Tooltip content="Mettre sur liste blanche (Simulation)">
                                                    <Button icon="unlock" minimal={true} small={true} />
                                                </Tooltip>
                                                <Tooltip content="Voir les logs réseau (Simulation)">
                                                    <Button icon="document" minimal={true} small={true} />
                                                </Tooltip>
                                            </td>
                                        </tr>
                                    ))}
                                    {threats.length === 0 && !loading && !error && (
                                        <tr>
                                            <td colSpan="5" style={{ textAlign: 'center', padding: '20px' }}>
                                                Aucune menace détectée.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </HTMLTable>
                        )}
                    </Card>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
