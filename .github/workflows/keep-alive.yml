name: Keep Render awake

# Render free instances sleep after 15 min without traffic (first request then takes ~30s).
# GitHub cron is best-effort and can be delayed, hence the 10-minute cadence.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://osint-monetization-suite.onrender.com/health
